<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSHA AI - Ask My Cameras</title>
    <link rel="stylesheet" href="ask.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="logo.jpg">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation (Same as dashboard) -->
        <nav class="sidebar">
            <div class="logo">
                <img src="logo.jpg" alt="Logo" class="logo-icon"
                    style="width: 36px; height: 36px; border-radius: 8px; object-fit: cover;">
                <h2>OSHA AI</h2>
            </div>
            <ul class="nav-links">
                <li><a href="/dashboard.html">Live Monitoring</a></li>
                <li class="active"><a href="/ask.html">Ask My Cameras</a></li>
                <li><a href="#">Settings</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <header>
                <h1>Ask My Cameras</h1>
                <p>Chat with your AI Security Assistant to instantly search past events.</p>
            </header>

            <div class="chat-container">
                <div id="chat-history" class="chat-history">
                    <div class="message assistant">
                        <p>Hello! I am your AI security assistant. What would you like to know about your cameras?</p>
                        <div class="suggestions">
                            <button onclick="askQuestion('Show every package today')">Show every package today</button>
                            <button onclick="askQuestion('Who entered the backyard yesterday?')">Who entered the
                                backyard yesterday?</button>
                            <button onclick="askQuestion('When was the last delivery?')">When was the last
                                delivery?</button>
                        </div>
                    </div>
                </div>

                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Ask a question... (e.g. 'Show me the red car')">
                    <button id="send-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>
    <script src="ask.js"></script>
</body>

</html>
